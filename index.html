<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusBubble</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                850: '#1e293b', 
                900: '#0f172a',
                950: '#020617',
              },
              // Override blue with the brand "Bubble" Cyan/Sky palette
              blue: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8',
                500: '#0ea5e9', // Brand Primary
                600: '#0284c7',
                700: '#0369a1',
                800: '#075985',
                900: '#0c4a6e',
                950: '#082f49',
              }
            },
            animation: {
              'fade-in-up': 'fade-in-up 0.3s ease-out forwards',
              'pop-in': 'pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'slide-in-left': 'slide-in-left 0.4s ease-out forwards',
              'slide-in-right': 'slide-in-right 0.4s ease-out forwards',
              'page-next': 'page-next 0.25s cubic-bezier(0.4, 0.0, 0.2, 1) forwards',
              'page-back': 'page-back 0.25s cubic-bezier(0.4, 0.0, 0.2, 1) forwards',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom scrollbar for chat */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      .animate-breathe {
        animation: breathe 4s ease-in-out infinite;
      }
      
      /* New Micro-Animations */
      @keyframes fade-in-up {
        0% { opacity: 0; transform: translateY(15px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes pop-in {
        0% { opacity: 0; transform: scale(0.9) translateY(10px); }
        60% { transform: scale(1.05); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }

      @keyframes slide-in-left {
        0% { opacity: 0; transform: translateX(-20px); }
        100% { opacity: 1; transform: translateX(0); }
      }

      @keyframes slide-in-right {
        0% { opacity: 0; transform: translateX(20px); }
        100% { opacity: 1; transform: translateX(0); }
      }

      /* Page Transitions */
      @keyframes page-next {
        0% { opacity: 0.8; transform: translateX(40px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes page-back {
        0% { opacity: 0.8; transform: translateX(-40px); }
        100% { opacity: 1; transform: translateX(0); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.32.0",
    "react": "https://esm.sh/react@^19.2.1",
    "react/": "https://esm.sh/react@^19.2.1/",
    "lucide-react": "https://esm.sh/lucide-react@^0.559.0",
    "recharts": "https://esm.sh/recharts@^3.5.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.1/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
<script>
  // Production mode detection and protection
  (function() {
    const isProduction = window.location.hostname !== 'localhost' && 
                        window.location.hostname !== '127.0.0.1' &&
                        !window.location.hostname.includes('192.168');
    
    if (isProduction) {
      // Add production mode class to body
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('production-mode');
      });
      
      // Disable right-click context menu
      document.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        return false;
      });
      
      // Disable DevTools shortcuts
      document.addEventListener('keydown', (e) => {
        // F12, Ctrl+Shift+I/J/C, Ctrl+U, Cmd+Option+I (Mac)
        if (e.key === 'F12' || 
            (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
            (e.ctrlKey && e.key.toUpperCase() === 'U') ||
            (e.metaKey && e.altKey && e.key.toUpperCase() === 'I')) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      });
      
      // Disable text selection (except inputs)
      document.addEventListener('selectstart', (e) => {
        const target = e.target;
        if (target.tagName !== 'INPUT' && target.tagName !== 'TEXTAREA' && 
            !target.isContentEditable) {
          e.preventDefault();
          return false;
        }
      });
      
      // Disable copy/paste
      document.addEventListener('copy', (e) => {
        const selection = window.getSelection();
        if (selection && selection.toString().length > 0) {
          e.preventDefault();
          e.clipboardData.setData('text/plain', '');
          return false;
        }
      });
      
      // Prevent drag events
      document.addEventListener('dragstart', (e) => {
        e.preventDefault();
        return false;
      });
      
      // Detect DevTools opening (basic detection)
      const detectDevTools = () => {
        const threshold = 160;
        if (window.outerWidth - window.innerWidth > threshold || 
            window.outerHeight - window.innerHeight > threshold) {
          console.clear();
        }
      };
      
      setInterval(detectDevTools, 1000);
      
      // Clear console regularly
      setInterval(() => console.clear(), 3000);
    }
  })();
</script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
